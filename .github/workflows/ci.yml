name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore v2rayF.slnx

      - name: Build desktop
        run: dotnet build src/v2rayF.Desktop/v2rayF.Desktop.csproj -c Release --no-restore

      - name: Test core
        run: dotnet test src/v2rayF.Core.Tests/v2rayF.Core.Tests.csproj -c Release --no-restore --verbosity normal

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d

      - name: Download Android assets (patched sing-box required)
        shell: pwsh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # D18 / PLAN: never allow stock libsingbox.so — TUN fd inheritance requires the patch.
        run: ./scripts/package-android.ps1

      - name: Build Android
        run: dotnet build src/v2rayF.Android/v2rayF.Android.csproj -c Release -f net10.0-android
