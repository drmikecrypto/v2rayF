name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  XRAY_VERSION: v26.7.28
  # Set repo variable ARTIFACT_SIGNING_ENABLED=true after Azure Artifact Signing is configured.
  # See docs/tips/windows-smartscreen.md
  ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
  ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
  ARTIFACT_SIGNING_CERT_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERT_PROFILE }}

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: android-arm64
            os: ubuntu-latest
            android: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        if: matrix.android == true
        run: dotnet workload install android

      - name: Decode Android release keystore
        if: matrix.android == true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 — Android releases must be signed with a stable key."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/v2rayf-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/v2rayf-release.jks" >> "$GITHUB_ENV"

      - name: Package Android APK
        if: matrix.android == true
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD) -or
              [string]::IsNullOrWhiteSpace('${{ secrets.ANDROID_KEY_ALIAS }}')) {
            throw "Missing Android signing secrets (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS)."
          }
          ./scripts/package-android-release.ps1 `
            -XrayVersion ${{ env.XRAY_VERSION }} `
            -KeystorePath $env:ANDROID_KEYSTORE_PATH `
            -KeyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'

      - name: Package ${{ matrix.rid }}
        if: matrix.android != true
        shell: pwsh
        run: ./scripts/package-all.ps1 -Rid ${{ matrix.rid }} -XrayVersion ${{ env.XRAY_VERSION }}

      # Authenticode via Microsoft Artifact Signing (formerly Trusted Signing).
      # Signs only v2rayF.exe — not bundled xray/sing-box (third-party).
      - name: Azure login (Artifact Signing)
        if: >-
          startsWith(matrix.rid, 'win-') &&
          vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign v2rayF.exe with Artifact Signing
        if: >-
          startsWith(matrix.rid, 'win-') &&
          vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ env.ARTIFACT_SIGNING_ENDPOINT != '' && env.ARTIFACT_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ env.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.ARTIFACT_SIGNING_CERT_PROFILE }}
          files: ${{ github.workspace }}\dist\v2rayF-${{ matrix.rid }}\publish\v2rayF.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: v2rayF
          description-url: https://github.com/drmikecrypto/v2rayF

      - name: Re-zip Windows package after signing
        if: >-
          startsWith(matrix.rid, 'win-') &&
          vars.ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $publish = "dist/v2rayF-$rid/publish"
          $zip = "dist/v2rayF-$rid.zip"
          $exe = Join-Path $publish 'v2rayF.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe after signing" }
          # Confirm Authenticode is present (best-effort on GHA Windows images).
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Authenticode status: $($sig.Status) publisher=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            throw "v2rayF.exe Authenticode status is $($sig.Status) (expected Valid)"
          }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip -Force
          Write-Host "Re-created signed $zip"

      - name: Windows signing skipped
        if: >-
          startsWith(matrix.rid, 'win-') &&
          vars.ARTIFACT_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          Write-Host "::notice::Windows Authenticode skipped (set repo variable ARTIFACT_SIGNING_ENABLED=true after Azure Artifact Signing setup — docs/tips/windows-smartscreen.md)"

      - uses: actions/upload-artifact@v4
        with:
          name: v2rayF-${{ matrix.rid }}
          path: dist/v2rayF-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: v2rayF-*
          merge-multiple: true

      - name: List release assets
        run: find artifacts -type f -name "*.zip" -ls

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: v2rayF ${{ github.ref_name }}
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
